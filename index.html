<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SEB-SOLOGYRO-BATTERIE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SEB-SOLOGYRO-BATTERIE">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<style>
  :root { --fond: #111; --texte: #eee; --gc: #e8643c; --cy: #e8c43c; --doux: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px -apple-system, system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 14px; -webkit-user-select: none; user-select: none; }
  h1 { font-size: 20px; margin: 0; }
  #etat { color: var(--doux); font-size: 14px; }
  button { font: inherit; font-size: 20px; padding: 18px; border: 0; border-radius: 12px; background: #2a6; color: #fff; }
  button.secondaire { font-size: 15px; padding: 12px; background: #2a2a2a; color: var(--texte); }
  #flash { flex: 1; min-height: 160px; border-radius: 16px; background: #1c1c1c; display: flex; align-items: center;
           justify-content: center; text-align: center; padding: 12px; font-size: 28px; font-weight: 600; transition: background .25s; }
  .jauges { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--doux); }
  .jauge { height: 10px; background: #222; border-radius: 5px; position: relative; overflow: hidden; }
  .jauge i { position: absolute; top: 0; bottom: 0; left: 50%; background: #48f; }
  label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--doux); }
  input[type=range] { flex: 1; }
  .reglages { display: flex; flex-direction: column; gap: 10px; }
  #diagnostic, #gain, #etatEnreg { font-size: 12px; color: var(--doux); }
  .enreg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .enreg button { font-size: 13px; padding: 8px 10px; }
  .cartouche { margin-top: 8px; border-top: 1px solid #2a2a2a; text-align: center; color: var(--doux); font-size: 12px; letter-spacing: .12em; line-height: 1.7; padding: 10px 0 0; }
  .cartouche a { color: #a9b6ff; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<h1>SEB-SOLOGYRO-BATTERIE</h1>
<div id="etat">Le téléphone joue lui-même : coup vers le sol → grosse caisse, coup vers le plafond → cymbale.</div>
<button id="demarrer">Toucher pour démarrer</button>
<div id="flash">—</div>
<div class="jauges">
  <span>1</span><div class="jauge"><i id="j0"></i></div>
  <span>2</span><div class="jauge"><i id="j1"></i></div>
  <span>3</span><div class="jauge"><i id="j2"></i></div>
</div>
<div class="reglages">
  <button id="calibrer" class="secondaire">Refaire la calibration (2 coups vers le bas, 2 vers le haut)</button>
  <label>Sensibilité <input type="range" id="seuil" min="0" max="100" step="1"> <span id="vseuil"></span></label>
  <label><input type="checkbox" id="precoce"> Déclenchement précoce (dès le début du geste)</label>
  <div id="diagnostic"></div>
  <div class="enreg"><button id="enregistrer" class="secondaire">Enregistrer 30 s de jeu (diagnostic)</button> <button id="envoyer" class="secondaire" hidden>Envoyer le fichier au Mac</button> <span id="etatEnreg"></span></div>
  <div id="gain"></div>
</div>

<footer class="cartouche">SEB-SOLOGYRO-BATTERIE · Sébastien Gay · Octobre 2026 · <a href="https://github.com/SEB102/seb-sologyro-batterie#readme" target="_blank" rel="noopener">Mode d'emploi</a> · <a href="https://github.com/SEB102/seb-sologyro-batterie/blob/main/LICENSE" target="_blank" rel="noopener">Licence CC BY-NC 4.0</a></footer>
<div id="version" style="font-size:11px;color:#555">version 2026-10-21k</div>
<script>
// Toute erreur s'affiche à l'écran (pas de console sur un téléphone)
const montrerErreur = (m) => { const e = document.getElementById('etat'); e.textContent = 'Erreur : ' + m; e.style.color = '#e66'; };
window.onerror = (msg, src, ligne) => montrerErreur(`${msg} (${(src || '').split('/').pop()}:${ligne})`);
window.onunhandledrejection = (e) => montrerErreur(e.reason && e.reason.message || e.reason);
</script>
<script src="detecteur.js?v=20261021k"></script>
<script src="sons.js?v=20261021k"></script>
<script>
const $ = (id) => document.getElementById(id);
const memo = (() => { try { return JSON.parse(localStorage.getItem('gyro-batterie') || '{}'); } catch { return {}; } })();
const reglages = { seuil: memo.seuil || 250, calibration: memo.calibration || null, precoce: !!memo.precoce };
const verticale = Detecteur.creerVerticale();   // sens du coup dans la pièce : vers le sol ou vers le plafond
if (reglages.calibration) verticale.regler(reglages.calibration.baguette || null);   // axe « baguette » appris à la calibration
const sauver = () => { try { localStorage.setItem('gyro-batterie', JSON.stringify(reglages)); } catch {} };

// ---- Son, joué par le téléphone lui-même ----
// iPhone : sans cela, le Web Audio se tait quand le bouton latéral est sur silencieux
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
const ctx = new AudioContext({ latencyHint: 'interactive' });
const sons = creerSons(ctx);

// ---- Sensibilité (curseur à droite = gestes plus légers) ----
let detecteur;
// Déclenchement précoce : le détecteur mesure à chaque coup le temps gagné sur le sommet du geste
const gains = [];
function afficherGain() {
  const moy = gains.reduce((a, b) => a + b, 0) / (gains.length || 1);
  $('gain').textContent = !reglages.precoce ? ''
    : gains.length ? `Gain mesuré : ${Math.round(moy)} ms plus tôt qu'au sommet du geste (moyenne sur ${gains.length} coup${gains.length > 1 ? 's' : ''})`
    : 'Gain mesuré : frappe pour le mesurer';
}
function noterGain(ms) { gains.push(ms); if (gains.length > 20) gains.shift(); afficherGain(); }
function appliquerSeuil(seuil) {
  reglages.seuil = seuil; sauver();
  detecteur = Detecteur.creerDetecteur({ seuil, precoce: reglages.precoce, surGain: noterGain });
  const p = Detecteur.seuilVersSensibilite(seuil);
  $('seuil').value = p; $('vseuil').textContent = p + ' %';
}
appliquerSeuil(reglages.seuil);
$('seuil').oninput = (e) => appliquerSeuil(Detecteur.sensibiliteVersSeuil(Number(e.target.value)));
$('precoce').checked = reglages.precoce; afficherGain();
$('precoce').onchange = (e) => { reglages.precoce = e.target.checked; gains.length = 0; appliquerSeuil(reglages.seuil); afficherGain(); };

// ---- Lecture du capteur, quel que soit le téléphone ----
// Gyroscope si présent ; sinon accéléromètre (sans gravité, ou avec gravité retirée par un filtre).
let gravite = null;
function lireAxes(e) {
  const r = e.rotationRate;
  if (r && [r.alpha, r.beta, r.gamma].some((v) => typeof v === 'number')) return { source: 'gyro', axes: [r.alpha || 0, r.beta || 0, r.gamma || 0] };
  const a = e.acceleration;
  if (a && typeof a.x === 'number') return { source: 'accel', axes: [a.x, a.y || 0, a.z || 0] };
  const g = e.accelerationIncludingGravity;
  if (g && typeof g.x === 'number') {
    const brut = [g.x, g.y || 0, g.z || 0];
    gravite = gravite ? gravite.map((v, i) => 0.9 * v + 0.1 * brut[i]) : brut;
    return { source: 'accelg', axes: brut.map((v, i) => v - gravite[i]) };
  }
  return null;
}

// ---- Calibration guidée : 2 coups vers le BAS, puis 2 vers le HAUT, en tenant le téléphone comme pour jouer ----
// Comme l'app sait dans quel sens va chaque coup, elle trouve sans deviner quel axe du téléphone sert de baguette
// (et dans quel sens), et elle vérifie que les 4 coups sont tous bien classés ; sinon elle recommence.
const SENS_CALIBRATION = [-1, -1, 1, 1], DUREE_MAX_CALIBRATION = 15000;
const NOM_AXE = ['en travers du téléphone', 'dans la longueur du téléphone', 'perpendiculaire à l\'écran'];
let calibration = null;   // { debut, echantillons, coups, fin } pendant la calibration
function afficherCalibration(titre, detail) {
  const n = calibration ? calibration.coups : 0;
  const fleches = SENS_CALIBRATION.map((s, i) => `<span style="opacity:${i < n ? 0.35 : 1}">${s < 0 ? '↓' : '↑'}</span>`).join(' ');
  $('flash').innerHTML = `<div style="font-size:20px;line-height:1.5">${titre}<br><span style="font-size:15px;font-weight:400;color:#bbb">${detail}</span>`
    + `<div style="font-size:34px;letter-spacing:.2em;margin-top:10px">${fleches}</div></div>`;
}
function consigne(n) {   // n coups déjà reconnus
  if (n >= SENS_CALIBRATION.length) return ['4 coups reconnus', 'un instant…'];
  return [`Coup ${n + 1} sur 4 : vers le ${SENS_CALIBRATION[n] < 0 ? 'BAS ↓' : 'HAUT ↑'}`, 'un coup sec, en tenant le téléphone comme pour jouer'];
}
function lancerCalibration(apres = 0) {
  calibration = { debut: performance.now() + apres, echantillons: [], coups: 0, fin: null };
  $('flash').style.background = '#234'; $('flash').style.color = '';
  if (!apres) afficherCalibration(...consigne(0));
}
function suivreCalibration(lu, t, e) {
  if (t < calibration.debut) return;   // pause après un essai raté, le message reste affiché
  const c = calibration;
  if (!c.echantillons.length) afficherCalibration(...consigne(0));
  c.echantillons.push({ t, axes: lu.axes, rot: e.rotationRate, acc: e.acceleration, accG: e.accelerationIncludingGravity });
  if (c.echantillons.length % 4 === 0) {
    const n = Math.max(c.coups, Detecteur.compterCoups(c.echantillons));   // ne recule jamais à l'écran
    if (n !== c.coups) {
      c.coups = Math.min(n, SENS_CALIBRATION.length);
      afficherCalibration(...consigne(c.coups));
      if (n >= SENS_CALIBRATION.length && !c.fin) c.fin = t + 400;   // laisser finir le dernier geste
    }
  }
  if (!(c.fin && t >= c.fin) && t - c.debut < DUREE_MAX_CALIBRATION) return;
  const res = Detecteur.calibrer(c.echantillons);
  const baguette = res && Detecteur.calibrerBaguetteGuidee(c.echantillons, SENS_CALIBRATION);
  if (!baguette) {
    afficherCalibration('Pas assez net', '2 coups francs vers le BAS, puis 2 vers le HAUT ; on recommence…');
    lancerCalibration(2500);
    return;
  }
  reglages.calibration = { ...res, source: lu.source, baguette }; sauver();
  verticale.regler(baguette);
  calibration = null;
  $('flash').style.background = '';
  $('flash').innerHTML = `<div style="font-size:22px;line-height:1.5">Calibré ! À toi de jouer<br><span style="font-size:14px;font-weight:400;color:#bbb">baguette ${NOM_AXE[baguette.axe.findIndex((x) => x)]}</span></div>`;
}

// ---- Enregistrement de diagnostic (temporaire) : 30 s de mesures brutes + chaque coup avec ce qui l'a décidé ----
// À la fin, « Envoyer le fichier au Mac » ouvre le partage de l'iPhone (AirDrop → dossier Téléchargements du Mac).
const DUREE_ENREG = 30000;
let enreg = null, fichierEnreg = null;   // enreg : { debut, mesures, coups }
const tableau = (o, champs) => (o && champs.some((k) => Number.isFinite(o[k])) ? champs.map((k) => Math.round((o[k] || 0) * 1000) / 1000) : null);
function enregistrer(e, t) {
  if (!enreg) return;
  enreg.mesures.push([Math.round(t), tableau(e.rotationRate, ['alpha', 'beta', 'gamma']), tableau(e.acceleration, ['x', 'y', 'z']),
    tableau(e.accelerationIncludingGravity, ['x', 'y', 'z']), e.interval]);
  const reste = Math.ceil((DUREE_ENREG - (t - enreg.debut)) / 1000);
  $('etatEnreg').textContent = reste > 0 ? `Joue normalement… ${reste} s` : '';
  if (t - enreg.debut >= DUREE_ENREG) terminerEnregistrement();
}
function terminerEnregistrement() {
  const contenu = { app: 'SEB-SOLOGYRO-BATTERIE', date: new Date().toISOString(), appareil: navigator.userAgent, reglages,
    colonnes: ['t (ms)', 'rotationRate [alpha, beta, gamma] °/s', 'acceleration [x, y, z] m/s²', 'accelerationIncludingGravity [x, y, z] m/s²', 'interval'],
    coups: enreg.coups, mesures: enreg.mesures };
  const nom = `sologyro-mesures-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.json`;
  fichierEnreg = new File([JSON.stringify(contenu)], nom, { type: 'application/json' });
  $('etatEnreg').textContent = `${enreg.mesures.length} mesures, ${enreg.coups.length} coups`;
  enreg = null;
  $('enregistrer').disabled = false; $('envoyer').hidden = false;
}
$('enregistrer').onclick = () => {
  if (!demarre) { $('etatEnreg').textContent = 'Démarre d\'abord (bouton du haut).'; return; }
  enreg = { debut: performance.now(), mesures: [], coups: [] };
  $('enregistrer').disabled = true; $('envoyer').hidden = true;
};
const telecharger = (f) => { const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(f), download: f.name }); document.body.append(a); a.click(); a.remove(); };
$('envoyer').onclick = async () => {
  if (!fichierEnreg) return;
  // partage de l'iPhone (AirDrop…) ; s'il est indisponible ou refusé, simple téléchargement
  if (navigator.canShare && navigator.canShare({ files: [fichierEnreg] })) {
    try { await navigator.share({ files: [fichierEnreg], title: fichierEnreg.name }); $('etatEnreg').textContent = 'Fichier envoyé'; return; }
    catch (err) { if (err && err.name === 'AbortError') return; }
  }
  telecharger(fichierEnreg);
  $('etatEnreg').textContent = 'Fichier téléchargé (dossier Téléchargements / Fichiers)';
};

// ---- Diagnostic de latence : cadence du capteur et retard de la sortie son ----
const intervalles = [];
let dernierT = null;
function diagnostiquer(t) {
  if (dernierT !== null) { intervalles.push(t - dernierT); if (intervalles.length > 60) intervalles.shift(); }
  dernierT = t;
}
setInterval(() => {
  if (intervalles.length < 10) return;
  const moy = intervalles.reduce((a, b) => a + b, 0) / intervalles.length;
  const sonMs = Math.round(((ctx.baseLatency || 0) + (ctx.outputLatency || 0)) * 1000);
  $('diagnostic').textContent = `Capteur : ${Math.round(1000 / moy)} mesures/s · détection : environ ${Math.round((reglages.precoce ? 0.5 : 1.5) * moy)} ms · sortie son : ${sonMs ? sonMs + ' ms' : 'inconnue'}`;
}, 1000);

// ---- Jeu ----
let timerFlash, maxAxes = [1, 1, 1], recu = false;
function surMouvement(e) {
  const lu = lireAxes(e); if (!lu) return;
  recu = true;
  const t = performance.now();
  verticale.ajouter(t, e.acceleration, e.accelerationIncludingGravity, e.rotationRate);
  enregistrer(e, t);
  diagnostiquer(t);
  lu.axes.forEach((v, i) => {   // jauges : chaque axe relativement à son maximum
    maxAxes[i] = Math.max(maxAxes[i], Math.abs(v));
    const n = v / maxAxes[i], el = $('j' + i);
    el.style.left = (n < 0 ? 50 + n * 50 : 50) + '%'; el.style.width = Math.abs(n) * 50 + '%';
  });
  if (calibration) return suivreCalibration(lu, t, e);
  const cal = reglages.calibration;
  // une calibration d'avant la version guidée est refaite une fois
  if (!cal || cal.source !== lu.source || !(cal.baguette && cal.baguette.guidee)) return lancerCalibration();

  const coup = detecteur.traiter(lu.axes[cal.axe] * cal.signe * cal.facteur, t);
  if (coup) {
    // vers le sol → grosse caisse, vers le plafond → cymbale ; sans mesure, sens de rotation
    const s = verticale.sens();
    const gc = s < 0 || (s === 0 && coup.type === 'grosse-caisse');
    if (enreg) enreg.coups.push({ t: Math.round(t), son: gc ? 'grosse-caisse' : 'cymbale', sens: s, bout: verticale.bout().map((x) => Math.round(x * 1000) / 1000),
      vitesseVerticale: Math.round(verticale.vitesse() * 1000) / 1000, force: Math.round(coup.force * 100) / 100, pic: Math.round(coup.pic) });
    (gc ? sons.grosseCaisse : sons.cymbale)(coup.force);
    $('flash').textContent = gc ? 'GROSSE CAISSE' : 'CYMBALE';
    $('flash').style.background = gc ? 'var(--gc)' : 'var(--cy)';
    $('flash').style.color = '#111';
    clearTimeout(timerFlash);
    timerFlash = setTimeout(() => { $('flash').style.background = ''; $('flash').style.color = ''; }, 150);
  }
}
$('calibrer').onclick = () => lancerCalibration();

// ---- Démarrage : un seul toucher débloque le son ET les mouvements ----
const auPlusTard = (promesse, ms, valeur) => Promise.race([promesse, new Promise((r) => setTimeout(() => r(valeur), ms))]);
const message = (texte) => { $('flash').textContent = texte; $('flash').style.fontSize = '18px'; };
let demarre = false;
async function demarrer() {
  if (demarre) return;
  ctx.resume();   // dans le geste : sinon le navigateur garde le son coupé
  if (typeof DeviceMotionEvent === 'undefined') return message('Ce navigateur ne donne pas accès aux mouvements');
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    $('demarrer').textContent = 'Autorisation…';
    let rep;
    try { rep = await auPlusTard(DeviceMotionEvent.requestPermission(), 15000, 'sans réponse'); }
    catch (err) { rep = 'erreur : ' + (err && err.message); }
    if (rep !== 'granted') {
      $('demarrer').textContent = 'Toucher pour démarrer';
      return message(rep === 'denied' ? 'Mouvements refusés : fermer l\'onglet, le rouvrir, puis Autoriser' : 'Autorisation des mouvements : ' + rep);
    }
  }
  demarre = true;
  window.addEventListener('devicemotion', surMouvement);
  try { navigator.wakeLock.request('screen').catch(() => {}); } catch {}
  $('demarrer').style.display = 'none';
  $('flash').textContent = reglages.calibration ? 'Frappe !' : '…';
  setTimeout(() => { if (!recu) message('Aucun mouvement reçu du capteur'); }, 2500);
}
$('demarrer').onclick = demarrer;
</script>
</body>
</html>
